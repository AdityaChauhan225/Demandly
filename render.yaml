services:
  # Demandly Full-Stack Web + API Application
  - type: web
    name: demandly
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: PRIVACY_K
        value: 5
      - key: PRIVACY_EPSILON
        value: 1.0
      - key: PRIVACY_SALT
        generateValue: true
      - key: CACHE_TTL_SECONDS
        value: 300
      - key: MAX_CELLS
        value: 5000
      - key: INGEST_API_KEY
        generateValue: true
      # Optional: To connect to an external PostgreSQL / Neon / Supabase database:
      # - key: DATABASE_URL
      #   value: postgresql://...
      # Optional: To connect to an external Redis / Upstash instance:
      # - key: REDIS_URL
      #   value: rediss://...
